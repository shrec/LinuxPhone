# Xiaomi Mi A2 (jasmine_sprout), Snapdragon 660
# Values from postmarketOS device-xiaomi-jasmine_sprout/deviceinfo.
NAME="Xiaomi Mi A2"
KERNEL_REPO="https://github.com/sdm660-mainline/linux"
KERNEL_TAG="v7.2.15-sdm660"
KERNEL_DEFCONFIG="sdm660_defconfig"
DTB="qcom/sdm660-xiaomi-jasmine"
# *_ignore_unused: keep the bootloader-enabled display alive until the msm display driver takes over.
# fbcon nodefer: take the screen at boot; a deferred takeover clears it later and wipes the on-screen keyboard.
# fbdev_overalloc=100: no off-screen framebuffer, so fbcon cannot pan away from where buffyboard draws.
# loglevel=5, not quiet: fbcon hides the boot logo when the loglevel is quiet (<=4). sysctl quiets it after boot.
# ponytail: panic=0 keeps a crash on screen while stage 1 is brought up; drop it for releases (reboot on panic).
CMDLINE="console=tty0 loglevel=5 panic=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused drm_kms_helper.drm_fbdev_overalloc=100 fbcon=font:TER16x32,logo-pos:center,logo-count:1,nodefer"
BOOTIMG_ARGS="--pagesize 4096 --base 0x00000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --second_offset 0x00f00000 --tags_offset 0x00000100"

# Wi-Fi/modem: Qualcomm helper daemons, and a unit that boots the modem DSP (which runs Wi-Fi)
# from the phone's own firmware partitions (devices/xiaomi-jasmine/rootfs).
PACKAGES="rmtfs,tqftpserv,qrtr-tools"
SERVICES="qcom-firmware"
# ath10k board-2.bin + firmware-5.bin (not on the phone's partitions), from postmarketOS's package.
# ponytail: pinned prebuilt .apk; build from its sources if the mirror drops this revision.
FIRMWARE_URL="https://mirror.postmarketos.org/postmarketos/master/aarch64/firmware-xiaomi-jasmine_sprout-2-r0.apk"
FIRMWARE_SHA512="05febc91e7f74f0e571e45dc341ca8528353e5369ff141b9aa9ac33bfd74429a08b20f026310e2790512041b88c557c2f86e69139881e496f2f04f28896ef18a"
