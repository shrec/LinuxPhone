# Adreno 5xx (freedreno, Mesa 26.1): glTexSubImage2D through the blitter never reaches the texture,
# so phoc showed only the first frame of shm clients (foot's prompt never appeared). Measured on the
# Mi A2: FD_MESA_DEBUG=noblit fixes it. GTK 4 picks Vulkan by default, which a5xx lacks: windows never map.
[Service]
Environment=FD_MESA_DEBUG=noblit GSK_RENDERER=gl
