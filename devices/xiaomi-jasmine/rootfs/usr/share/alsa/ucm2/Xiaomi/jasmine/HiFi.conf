# Xiaomi Mi A2 audio paths. One playback stream (MultiMedia1, hw:0) is routed by the ADSP to
# either the TAS2557 speaker amplifier (Primary MI2S) or the PM660L codec (internal MI2S 0:
# earpiece, headphones). The microphones come in on internal MI2S 3 to MultiMedia2 (hw:1).

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
		"Headphones"
	]
	EnableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='RDAC2 MUX' RX1"
		cset "name='Digital RX1 Digital Volume' 84"
		cset "name='EAR_S' 1"
	]
	DisableSequence [
		cset "name='EAR_S' 0"
		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]
	EnableSequence [
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='Digital RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='Digital RX1 Digital Volume' 84"
		cset "name='Digital RX2 Digital Volume' 84"
		cset "name='HPHL' 1"
		cset "name='HPHR' 1"
	]
	DisableSequence [
		cset "name='HPHL' 0"
		cset "name='HPHR' 0"
		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='Digital RX2 MIX1 INP1' ZERO"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
		cset "name='Digital DEC1 MUX' ADC1"
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 6"
	]
	DisableSequence [
		cset "name='Digital DEC1 MUX' ZERO"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='Digital DEC1 MUX' ADC2"
		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='ADC2 Volume' 6"
	]
	DisableSequence [
		cset "name='Digital DEC1 MUX' ZERO"
		cset "name='ADC2 MUX' ZERO"
		cset "name='MultiMedia2 Mixer LPI_MI2S_TX_3' 0"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
	}
}
